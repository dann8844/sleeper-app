workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    environment:
      node: 20.17.0
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild
        script: npx expo prebuild --platform android --clean
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - dan1dan2dan3@gmail.com
        notify:
          success: true
          failure: true
